
name: Build and Test

on:
  push:
  pull_request:

jobs:
  Build_and_Test:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, self-hosted-x86]
        include:
          - os: ubuntu-24.04-arm
            image: ghcr.io/andrewofc/avxbuild-arm64:latest
          - os: self-hosted-x86
            image: null
        
    runs-on: ${{ matrix.os }}
    container:
        image: ${{ matrix.image || null }}
    steps:
      - name: cpuinfo ${{ matrix.os }}
        run: cat /proc/cpuinfo && lscpu
      - name: json-dev
        run: sudo apt-get install -y libboost-json-dev
      - uses: actions/checkout@v7
      - name: Render
        working-directory: python
        run: python3 vector_gen.py
      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
      - name: Run tests
        run: build/unittests
      - name: benchmark
        run: build/redux --double -C 10 -i 1000 -t 1